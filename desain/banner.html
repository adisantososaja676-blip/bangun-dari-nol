<!doctype html>
<html lang="id"><head><meta charset="utf-8"><title>Banner</title>
<style>
@font-face { font-family: 'Nunito'; font-weight: 900; src: url('/node_modules/@fontsource/nunito/files/nunito-latin-900-normal.woff2') format('woff2'); }
@font-face { font-family: 'Nunito'; font-weight: 800; src: url('/node_modules/@fontsource/nunito/files/nunito-latin-800-normal.woff2') format('woff2'); }
html,body{margin:0;background:#111}
#b{position:relative;width:1280px;height:720px;overflow:hidden;font-family:Nunito,sans-serif}
#gl{position:absolute;inset:0;width:100%;height:100%}
/* area aman YouTube: 1546x423 dari 2560x1440 → 773x211.5 di kanvas 1280x720, di tengah */
#safe{position:absolute;left:253.5px;top:254px;width:773px;height:212px;display:flex;align-items:center;gap:6px}
#safe img{height:240px;margin:6px -26px 0 -34px;filter:drop-shadow(0 6px 0 rgba(0,0,0,.25))}
.t1{font-weight:900;font-size:58px;line-height:1;color:#fff;-webkit-text-stroke:9px #10363d;paint-order:stroke fill;text-shadow:0 5px 0 rgba(0,0,0,.3)}
.t1 .y{color:#ffd23f}
.t2{margin-top:12px;display:inline-block;white-space:nowrap;background:#fff;color:#10363d;font-weight:900;font-size:19px;padding:7px 16px;border-radius:999px;box-shadow:0 4px 0 rgba(0,0,0,.25)}
.guide #safe{outline:2px dashed #f0f}
</style>
<script type="importmap">{ "imports": { "three": "/node_modules/three/build/three.module.js" } }</script>
</head><body>
<div id="b"><canvas id="gl"></canvas>
  <div id="safe"><img id="bero" src="/out/bero-transparent.png">
    <div><div class="t1">Pak Bero<br><span class="y">Bangun dari Nol</span></div>
    <div class="t2">Coba, gagal, bangun lagi · Video baru setiap hari</div></div></div>
</div>
<script type="module">
// Latar: dunia ep. 01 di akhir cerita (bendungan + pelimpah), kamera lebar. ?guide=1 → tampilkan area aman
import { createKit } from '/engine/kit.js';
const q = new URLSearchParams(location.search);
if (q.has('guide')) document.body.classList.add('guide');
const timing = await fetch('/episodes/01-bendungan/timing.json').then(r => r.json());
const { build } = await import('/episodes/01-bendungan/scene.js');
const byId = Object.fromEntries(timing.lines.map(l => [l.id, l]));
const T = { duration: timing.duration, s: id => byId[id].start, e: id => byId[id].end,
  p: (t, a, b = a, pad = 0) => Math.min(1, Math.max(0, (t - byId[a].start - pad) / (byId[b].end - byId[a].start - pad))),
  in: (t, a, b = a) => t >= byId[a].start && t < byId[b].end };
const kit = createKit(document.getElementById('gl'), 1280, 720, 2);
const api = build(kit, T);
api.update(T.e('berdiri') - 0.05);
kit.scene.getObjectByName('bero').visible = false;
kit.camera.aspect = 1280 / 720; kit.camera.fov = 38;
kit.camera.position.set(3.2, 1.6, 16); kit.camera.lookAt(0.6, -1.4, 0);
kit.camera.updateProjectionMatrix();
kit.render();
await document.fonts.ready; await new Promise(r => { const i = document.getElementById('bero'); i.complete ? r() : (i.onload = r); });
window.READY = true;
</script></body></html>
